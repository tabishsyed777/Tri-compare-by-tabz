<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f7f4"><title>TripCompare — find your best way there</title>
<style>
:root{color-scheme:light;--ink:#16231d;--muted:#68746d;--paper:#f6f7f4;--card:#fff;--line:#e3e8e2;--green:#145c3b;--lime:#c7f36b;--mint:#eaf4ed;--amber:#fff4d9;--amber-ink:#76520a;--shadow:0 16px 48px #1c332110}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}a{color:var(--green)}.shell{max-width:1080px;margin:auto;padding:0 24px 64px}.nav{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.04em;font-size:20px}.mark{width:32px;height:32px;border-radius:10px;background:var(--green);color:var(--lime);display:grid;place-items:center;font-size:17px}.nav-note{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:6px 11px;border-radius:99px}.hero{padding:54px 0 26px;max-width:760px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}h1{font-size:clamp(36px,6vw,58px);line-height:1.03;letter-spacing:-.055em;margin:14px 0}.hero p{color:var(--muted);font-size:17px;max-width:610px;margin:14px 0 0}.searchbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:9px;box-shadow:var(--shadow);display:flex;gap:8px;max-width:860px}.searchbox input{min-width:0;flex:1;border:0;outline:0;background:transparent;padding:13px 14px;color:var(--ink)}.searchbox input:focus-visible{box-shadow:inset 0 0 0 2px #145c3b55;border-radius:10px}.searchbox button{border:0;border-radius:13px;background:var(--green);color:#fff;font-weight:700;padding:0 24px;cursor:pointer}.searchbox button:hover{background:#0c472d}.searchbox button:disabled{opacity:.6;cursor:wait}.examples{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 28px}.examples span{font-size:12px;color:var(--muted);padding:6px 0}.examples button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 11px;color:#47554c;font-size:12px;cursor:pointer}.examples button:hover{border-color:var(--green);color:var(--green)}#out{min-height:20px}.summary{padding:19px 22px;border-radius:16px;background:var(--green);color:#fff;font-size:15px}.summary strong{color:var(--lime)}.section-head{display:flex;justify-content:space-between;align-items:end;margin:30px 0 12px}.section-head h2{margin:0;font-size:20px;letter-spacing:-.03em}.section-head span,.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.option{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 20px #1c332108;min-width:0}.option.featured{border-color:#9acb83;box-shadow:0 0 0 1px #9acb8355,0 8px 24px #1c33210b}.option-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.kind{font-size:16px;font-weight:750;letter-spacing:-.02em}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}.tag{font-size:10px;font-weight:750;color:var(--green);background:var(--mint);border-radius:99px;padding:3px 8px}.tag.primary{background:var(--lime)}.price{font-size:23px;font-weight:800;letter-spacing:-.04em;white-space:nowrap}.price small{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0}.route{color:var(--muted);font-size:12px;margin:7px 0 14px}.metrics{display:flex;gap:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:11px 0;margin-bottom:12px}.metric{font-size:12px}.metric b{display:block;font-size:13px;color:var(--ink)}.legs{list-style:none;padding:0;margin:0}.legs li{padding:9px 0;border-bottom:1px dashed var(--line);font-size:12px}.legs li:last-child{border:0}.leg-main{display:flex;justify-content:space-between;gap:8px}.leg-mode{font-weight:700;text-transform:capitalize}.leg-detail{color:var(--muted);margin-top:2px}.links{display:flex;gap:10px;margin-top:4px}.links a{font-size:11px;font-weight:650;text-decoration:none}.links a:hover{text-decoration:underline}.notice{background:var(--amber);color:var(--amber-ink);border-radius:10px;padding:10px 12px;font-size:12px;margin:9px 0}.notice.error{background:#ffebea;color:#84251f}.connection{margin-top:18px;padding:18px 20px;background:#eef1e7;border:1px solid var(--line);border-radius:16px}.connection h3{font-size:14px;margin:0 0 4px}.fineprint{font-size:11px;color:var(--muted);margin:17px 0 0}.empty{padding:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--muted)}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #ffffff66;border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:680px){.shell{padding:0 16px 42px}.nav{height:64px}.nav-note{font-size:10px}.hero{padding:38px 0 23px}.hero p{font-size:15px}.searchbox{border-radius:15px}.searchbox input{padding:11px 7px;font-size:14px}.searchbox button{padding:0 15px}.grid{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column;gap:3px}.price{font-size:21px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head>
<body><div class="shell">
<header class="nav"><div class="brand"><span class="mark" aria-hidden="true">↗</span>TripCompare</div><span class="nav-note">India · Compare ways to travel</span></header>
<main><section class="hero"><div class="eyebrow">One search. Every route.</div><h1>Get there the way<br>that works for you.</h1><p>Tell us where you’re going. Compare flights, buses, trains and mixed routes by price and travel time.</p></section>
<form class="searchbox" id="f"><input id="q" maxlength="300" placeholder="Try “Akola to Mumbai this Friday, cheapest”" autocomplete="off" aria-label="Describe your trip"><button id="submit">Find routes <span aria-hidden="true">↗</span></button></form>
<div class="examples" id="chips"><span>Try:</span></div><section id="out" aria-live="polite" aria-busy="false"></section>
</main></div>
<script>
const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const samples=["Akola to Mumbai cheapest","Akola to Pune fastest","Nagpur to Delhi tomorrow","Akola to Hyderabad no flights"];
samples.forEach(s=>{const b=el("button","",s);b.type="button";b.onclick=()=>{$("q").value=s;go()};$("chips").append(b)});
$("f").onsubmit=e=>{e.preventDefault();go()};
const inr=n=>"₹"+Number(n).toLocaleString("en-IN");
function showError(message){const n=el("div","notice error",message);$("out").replaceChildren(n)}
async function go(){
 const q=$("q").value.trim();if(!q){$("q").focus();return}
 const out=$("out"),submit=$("submit");out.setAttribute("aria-busy","true");submit.disabled=true;submit.innerHTML='<span class="spinner" aria-hidden="true"></span>Comparing';out.replaceChildren(el("div","empty","Finding available route ideas…"));
 let r;try{const response=await fetch("/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q})});r=await response.json()}catch(e){showError("We couldn’t reach TripCompare. Check that the local server is running and try again.");finish();return}
 out.replaceChildren();if(!r.ok){(r.errors||["No route found."]).forEach(message=>out.append(el("div","notice error",message)));finish();return}
 const summary=el("div","summary");summary.textContent=r.answer.replaceAll("**","");out.append(summary);
 (r.notes||[]).forEach(message=>out.append(el("div","notice",message)));
 const head=el("div","section-head"),title=el("h2","","Your route options"),count=el("span","",`${r.options.length} ways to travel`);head.append(title,count);out.append(head);
 const grid=el("div","grid");(r.options||[]).forEach(o=>{
  const card=el("article","option"+(o.tags.includes("cheapest")?" featured":""));const top=el("div","option-top"),left=el("div");const tags=el("div","tags");o.tags.forEach(t=>tags.append(el("span","tag"+(t==="cheapest"?" primary":""),t)));left.append(tags,el("div","kind",o.kind));top.append(left);
  const price=el("div","price",`${inr(o.price_lo)}–${inr(o.price_hi)}`);price.append(el("small","",` / ${o.price_kind}`));top.append(price);card.append(top,el("div","route",o.route));
  const metrics=el("div","metrics"),duration=el("div","metric"),durationVal=el("b","",`~${o.total_hours} hours`);duration.append(durationVal,document.createTextNode(" door to door"));const estimate=el("div","metric"),estimateVal=el("b","",inr(o.price_typical));estimate.append(estimateVal,document.createTextNode(" typical estimate"));metrics.append(duration,estimate);card.append(metrics);
  const legs=el("ul","legs");o.legs.forEach(l=>{const item=el("li"),main=el("div","leg-main");main.append(el("span","leg-mode",l.mode),el("span","",`${inr(l.price_lo)}–${inr(l.price_hi)}`));item.append(main,el("div","leg-detail",`${l.from} → ${l.to} · about ${Math.round(l.minutes/6)/10} h`));if(l.note)item.append(el("div","leg-detail",l.note));if(l.links&&l.links.length){const links=el("div","links");l.links.forEach(k=>{const a=el("a","",k.label);a.href=k.url;a.target="_blank";a.rel="noopener noreferrer";links.append(a)});item.append(links)}legs.append(item)});card.append(legs);
  (o.warnings||[]).forEach(w=>card.append(el("div","notice",w)));grid.append(card)
 });out.append(grid);
 if(r.connection_analysis&&r.connection_analysis.text){const c=el("section","connection");c.append(el("h3","","Could a connection save you money?"),el("div","",r.connection_analysis.text));out.append(c)}
 out.append(el("p","fineprint",r.disclaimer));finish();
 function finish(){out.setAttribute("aria-busy","false");submit.disabled=false;submit.textContent="Find routes ↗"}
}
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f7f4"><title>TripCompare — find your best way there</title>
<style>
:root{--ink:#16231d;--muted:#68746d;--paper:#f6f7f4;--card:#fff;--line:#e3e8e2;--green:#145c3b;--lime:#c7f36b;--mint:#eaf4ed;--amber:#fff4d9;--amber-ink:#76520a;--shadow:0 16px 48px #1c332110}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}a{color:var(--green)}.shell{max-width:1080px;margin:auto;padding:0 24px 64px}.nav{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.04em;font-size:20px}.mark{width:32px;height:32px;border-radius:10px;background:var(--green);color:var(--lime);display:grid;place-items:center;font-size:17px}.nav-note{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:6px 11px;border-radius:99px}.hero{padding:54px 0 26px;max-width:760px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}h1{font-size:clamp(36px,6vw,58px);line-height:1.03;letter-spacing:-.055em;margin:14px 0}.hero p{color:var(--muted);font-size:17px;max-width:610px;margin:14px 0 0}.searchbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:9px;box-shadow:var(--shadow);display:flex;gap:8px;max-width:860px}.searchbox input{min-width:0;flex:1;border:0;outline:0;background:transparent;padding:13px 14px;color:var(--ink)}.searchbox input:focus-visible{box-shadow:inset 0 0 0 2px #145c3b55;border-radius:10px}.searchbox button{border:0;border-radius:13px;background:var(--green);color:#fff;font-weight:700;padding:0 24px;cursor:pointer}.searchbox button:disabled{opacity:.6;cursor:wait}.examples{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 28px}.examples span{font-size:12px;color:var(--muted);padding:6px 0}.examples button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 11px;color:#47554c;font-size:12px;cursor:pointer}.examples button:hover{border-color:var(--green);color:var(--green)}#out{min-height:20px}.summary{padding:19px 22px;border-radius:16px;background:var(--green);color:#fff;font-size:15px}.section-head{display:flex;justify-content:space-between;align-items:end;margin:30px 0 12px}.section-head h2{margin:0;font-size:20px;letter-spacing:-.03em}.section-head span,.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.option{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 20px #1c332108;min-width:0}.option.featured{border-color:#9acb83;box-shadow:0 0 0 1px #9acb8355,0 8px 24px #1c33210b}.option-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.kind{font-size:16px;font-weight:750;letter-spacing:-.02em}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}.tag{font-size:10px;font-weight:750;color:var(--green);background:var(--mint);border-radius:99px;padding:3px 8px}.tag.primary{background:var(--lime)}.price{font-size:23px;font-weight:800;letter-spacing:-.04em;white-space:nowrap}.price small{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0}.route{color:var(--muted);font-size:12px;margin:7px 0 14px}.metrics{display:flex;gap:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:11px 0;margin-bottom:12px}.metric{font-size:12px}.metric b{display:block;font-size:13px;color:var(--ink)}.legs{list-style:none;padding:0;margin:0}.legs li{padding:9px 0;border-bottom:1px dashed var(--line);font-size:12px}.legs li:last-child{border:0}.leg-main{display:flex;justify-content:space-between;gap:8px}.leg-mode{font-weight:700;text-transform:capitalize}.leg-detail{color:var(--muted);margin-top:2px}.links{display:flex;gap:10px;margin-top:4px}.links a{font-size:11px;font-weight:650;text-decoration:none}.links a:hover{text-decoration:underline}.notice{background:var(--amber);color:var(--amber-ink);border-radius:10px;padding:10px 12px;font-size:12px;margin:9px 0}.notice.error{background:#ffebea;color:#84251f}.connection{margin-top:18px;padding:18px 20px;background:#eef1e7;border:1px solid var(--line);border-radius:16px}.connection h3{font-size:14px;margin:0 0 4px}.fineprint{font-size:11px;color:var(--muted);margin:17px 0 0}.empty{padding:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--muted)}@media(max-width:680px){.shell{padding:0 16px 42px}.nav{height:64px}.nav-note{font-size:10px}.hero{padding:38px 0 23px}.hero p{font-size:15px}.searchbox{border-radius:15px}.searchbox input{padding:11px 7px;font-size:14px}.searchbox button{padding:0 15px}.grid{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column;gap:3px}.price{font-size:21px}}
</style></head><body><div class="shell"><header class="nav"><div class="brand"><span class="mark" aria-hidden="true">↗</span>TripCompare</div><span class="nav-note">India · Compare ways to travel</span></header><main><section class="hero"><div class="eyebrow">One search. Every route.</div><h1>Get there the way<br>that works for you.</h1><p>Tell us where you’re going. Compare flights, buses, trains and mixed routes by price and travel time.</p></section>
<form class="searchbox" id="f"><input id="q" maxlength="300" placeholder="Try “Akola to Mumbai cheapest”" autocomplete="off" aria-label="Describe your trip"><button id="submit">Find routes ↗</button></form><div class="examples" id="chips"><span>Try:</span></div><section id="out" aria-live="polite"></section></main></div>
<script>
const $=id=>document.getElementById(id), el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}, inr=n=>"₹"+Math.round(n).toLocaleString("en-IN");
let places=[],routes=[];
Promise.all([fetch("./data/places.json").then(r=>r.json()),fetch("./data/routes.json").then(r=>r.json())]).then(([p,r])=>{places=p;routes=r.routes;}).catch(()=>{$("out").append(el("div","notice error","Trip data failed to load. Refresh the page and try again."))});
["Akola to Mumbai cheapest","Akola to Pune fastest","Nagpur to Delhi","Akola to Hyderabad"].forEach(s=>{const b=el("button","",s);b.type="button";b.onclick=()=>{$("q").value=s;go()};$("chips").append(b)});$("f").onsubmit=e=>{e.preventDefault();go()};
function parseQuery(q){const t=q.toLowerCase(), found=[];places.forEach(p=>[p.id,p.name,...(p.aliases||[])].forEach(a=>{const re=new RegExp("(?<![a-z])"+a.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").toLowerCase()+"(?![a-z])","g");for(const m of t.matchAll(re))found.push({id:p.id,start:m.index,end:m.index+a.length})}));found.sort((a,b)=>a.start-b.start||(b.end-b.start)-(a.end-a.start));const uniq=found.filter((x,i)=>!found.slice(0,i).some(y=>y.id===x.id&&y.start===x.start));const sep=t.indexOf(" to ");let o,d;if(sep>=0){o=uniq.filter(x=>x.end<=sep).at(-1)?.id;d=uniq.find(x=>x.start>=sep+4)?.id}o=o||uniq[0]?.id;d=d||uniq.find(x=>x.id!==o)?.id;return{origin:o,dest:d,pref:/\b(cheap|cheapest|budget|lowest|save)\b/.test(t)?"cheapest":/\b(fast|fastest|quick|quickest)\b/.test(t)?"fastest":"balanced",exclude:[...([/\b(no|without|avoid)\s+(flights?|air)\b|\bby (bus|train)\b/.test(t)?["flight"]:[]),...(/\b(no|without|avoid)\s+bus/.test(t)?["bus"]:[]),...(/\b(no|without|avoid)\s+trains?/.test(t)?["train"]:[])]}}
function findPaths(o,d,exclude){const graph={};routes.filter(x=>!exclude.includes(x.mode)).forEach(r=>{[[r.a,r.b],[r.b,r.a]].forEach(([a,b])=>(graph[a]??=[]).push({from:a,to:b,mode:r.mode,min:r.min,lo:r.lo,hi:r.hi}))});const out=[];function walk(node,seen,legs){if(node===d){out.push(legs);return}if(legs.length>=3)return;for(const l of graph[node]||[]){if(seen.has(l.to)||(legs.length&&l.mode===legs.at(-1).mode&&l.mode!=="flight"))continue;walk(l.to,new Set([...seen,l.to]),[...legs,l])}}walk(o,new Set([o]),[]);return out.map(legs=>{let lo=0,hi=0,min=0;legs.forEach(l=>{lo+=l.lo;hi+=l.hi;min+=l.min});let extras=[];if(legs[0].mode==="flight"){lo+=300;hi+=700;min+=60;extras.push("Airport travel + check-in")}legs.slice(1).forEach((l,i)=>{const prev=legs[i],airA=prev.mode==="flight",airB=l.mode==="flight",tm=airA?(airB?120:90):(airB?150:45),cost=airA===airB?[0,0]:[250,600];min+=tm;lo+=cost[0];hi+=cost[1];if(cost[1])extras.push("Transfer at "+name(prev.to))});if(legs.at(-1).mode==="flight"){lo+=300;hi+=700;min+=45;extras.push("Airport to destination")}return{legs,lo,hi,min,extras,kind:legs.map(x=>x.mode).join(" + ")}})}
function name(id){return places.find(p=>p.id===id)?.name||id}function search(q){const p=parseQuery(q);if(!p.origin||!p.dest)return{error:"Please enter a known origin and destination, such as Akola to Mumbai."};if(p.origin===p.dest)return{error:"Choose two different cities."};let all=findPaths(p.origin,p.dest,p.exclude);if(!all.length)return{error:"No route options found in the current seed dataset. Try another city pair."};const mid=x=>(x.lo+x.hi)/2,score=x=>x.min/60*250+mid(x),cheapest=all.reduce((a,b)=>mid(a)<mid(b)?a:b),fastest=all.reduce((a,b)=>a.min<b.min?a:b),balanced=all.reduce((a,b)=>score(a)<score(b)?a:b);const best={};all.forEach(x=>{if(!best[x.kind]||score(x)<score(best[x.kind]))best[x.kind]=x});let opts=Object.values(best).sort((a,b)=>p.pref==="cheapest"?mid(a)-mid(b):p.pref==="fastest"?a.min-b.min:score(a)-score(b));opts=opts.slice(0,6);opts.forEach(x=>x.tags=[...(x===cheapest?["cheapest"]:[]),...(x===fastest?["fastest"]:[]),...(x===balanced?["best balance"]:[])]);let connections=all.filter(x=>x.legs.filter(l=>l.mode==="flight").length>=2).sort((a,b)=>mid(a)-mid(b))[0];const direct=all.filter(x=>x.legs.length===1&&x.legs[0].mode==="flight").sort((a,b)=>mid(a)-mid(b))[0];return{p,opts,cheapest,fastest,balanced,connections,direct}}
function linkList(l){const o=places.find(p=>p.id===l.from),d=places.find(p=>p.id===l.to),map="https://www.google.com/maps/dir/?api=1&travelmode=transit&origin="+encodeURIComponent(o.name)+"&destination="+encodeURIComponent(d.name);if(l.mode==="flight"&&o.iata&&d.iata)return[{label:"Check fares on Google Flights",url:"https://www.google.com/travel/flights?q="+encodeURIComponent(`Flights from ${o.iata} to ${d.iata}`)}];if(l.mode==="bus")return[{label:"Find buses on redBus",url:"https://www.redbus.in/"},{label:"Google Maps",url:map}];if(l.mode==="train")return[{label:"Check trains on IRCTC",url:"https://www.irctc.co.in/"},{label:"Google Maps",url:map}];return[{label:"Google Maps",url:map}]}
function render(q){const out=$("out"),r=search(q);out.replaceChildren();if(r.error){out.append(el("div","notice error",r.error));return}const msg=el("div","summary",`${name(r.p.origin)} → ${name(r.p.dest)} · cheapest ${r.cheapest.kind} about ${inr(r.cheapest.lo)}–${inr(r.cheapest.hi)}; fastest ${r.fastest.kind} around ${(r.fastest.min/60).toFixed(1)} hours. All prices are seed estimates.`);out.append(msg);const head=el("div","section-head");head.append(el("h2","","Your route options"),el("span","",`${r.opts.length} route types`));out.append(head);const grid=el("div","grid");r.opts.forEach(o=>{const card=el("article","option"+(o.tags.includes("cheapest")?" featured":"")),top=el("div","option-top"),left=el("div"),tags=el("div","tags");o.tags.forEach(t=>tags.append(el("span","tag"+(t==="cheapest"?" primary":""),t)));left.append(tags,el("div","kind",o.kind));top.append(left);const price=el("div","price",`${inr(o.lo)}–${inr(o.hi)}`);price.append(el("small",""," / estimate"));top.append(price);card.append(top,el("div","route",[name(o.legs[0].from),...o.legs.map(l=>name(l.to))].join(" → ")));const metrics=el("div","metrics"),dur=el("div","metric"),typ=el("div","metric");dur.append(el("b","",`~${(o.min/60).toFixed(1)} hours`),document.createTextNode(" door to door"));typ.append(el("b","",inr((o.lo+o.hi)/2)),document.createTextNode(" typical estimate"));metrics.append(dur,typ);card.append(metrics);const ul=el("ul","legs");o.legs.forEach(l=>{const li=el("li"),line=el("div","leg-main");line.append(el("span","leg-mode",l.mode),el("span","",`${inr(l.lo)}–${inr(l.hi)}`));li.append(line,el("div","leg-detail",`${name(l.from)} → ${name(l.to)} · ~${(l.min/60).toFixed(1)} h`));const links=el("div","links");linkList(l).forEach(k=>{const a=el("a","",k.label);a.href=k.url;a.target="_blank";a.rel="noopener noreferrer";links.append(a)});li.append(links);ul.append(li)});card.append(ul);if(o.legs.length>1)card.append(el("div","notice","Multiple tickets may not protect a missed connection. Confirm transfer times before booking."));grid.append(card)});out.append(grid);if(r.connections){const c=el("section","connection"),saving=r.direct?((r.direct.lo+r.direct.hi-r.connections.lo-r.connections.hi)/2):null;c.append(el("h3","","Connecting-flight estimate"),el("div","",saving===null?"Connecting flights appear in the seed data. No nonstop flight is listed for comparison.":saving>0?`This connection could save roughly ${inr(saving)} versus the estimated nonstop fare, with more travel time. Separate tickets carry missed-connection risk.`:`The connecting option does not appear cheaper than the estimated nonstop fare in the seed data.`));out.append(c)}out.append(el("p","fineprint","Seed estimates only. Not live fares, schedules, seat availability, or booking results. Confirm availability and prices with the operator before travel. Connecting times are rough planning assumptions."))}
function go(){const q=$("q").value.trim();if(q)render(q)}
</script></body></html>
